name: Deploy

on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region"
        required: false
        default: "{{region}}"
      cluster_name:
        description: "EKS cluster name"
        required: false
        default: "{{cluster_name}}"

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.region }}.amazonaws.com
  IMAGE_NAME: "{{service_name}}"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }} .
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ inputs.cluster_name }} --region ${{ inputs.region }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install {{service_name}} ./helm \
            --set image.repository=$ECR_REGISTRY/$IMAGE_NAME \
            --set image.tag=${{ github.sha }} \
            --namespace default
