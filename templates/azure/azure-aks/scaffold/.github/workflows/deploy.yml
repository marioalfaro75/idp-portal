name: Deploy

on:
  workflow_dispatch:
    inputs:
      resource_group_name:
        description: "Azure resource group"
        required: false
        default: "{{resource_group_name}}"
      cluster_name:
        description: "AKS cluster name"
        required: false
        default: "{{cluster_name}}"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/{{service_name}}:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/{{service_name}}:${{ github.sha }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ inputs.resource_group_name }} --name ${{ inputs.cluster_name }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install {{service_name}} ./helm \
            --set image.repository=${{ secrets.ACR_LOGIN_SERVER }}/{{service_name}} \
            --set image.tag=${{ github.sha }} \
            --namespace default
