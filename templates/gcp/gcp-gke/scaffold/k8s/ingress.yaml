apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{service_name}}
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{service_name}}
                port:
                  number: 80
