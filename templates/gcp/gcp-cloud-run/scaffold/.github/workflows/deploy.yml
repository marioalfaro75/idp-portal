name: Deploy

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "GCP project ID"
        required: false
        default: "{{project_id}}"
      region:
        description: "GCP region"
        required: false
        default: "{{region}}"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev

      - name: Build and push to Artifact Registry
        run: |
          gcloud builds submit \
            --tag ${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/{{service_name}}/{{service_name}}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy {{service_name}} \
            --image ${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/{{service_name}}/{{service_name}}:${{ github.sha }} \
            --region ${{ inputs.region }} \
            --platform managed \
            --allow-unauthenticated
